# multi-angle-verify.yaml — POC graph spec
# 패턴: draft → 3 parallel critique → synthesize
# 사용: python plugins/exec_graph/runtime/run_graph.py plugins/exec_graph/specs/multi-angle-verify.yaml --input "<task>"

name: multi-angle-verify
description: |
  초안을 3가지 다른 시각 (보안·성능·가독성) 으로 병렬 비판 → 통합 최종안.
  Linear task-instruction 으로는 어려운 multi-angle 검증 패턴.

nodes:
  - id: draft
    agent: claude-opus-4-8
    prompt: "{input} 에 대한 초안 작성. 모든 측면 포함."

  - id: critique-security
    agent: claude-haiku-4-5
    prompt: "초안을 보안 관점에서 비판. 취약점·위험·OWASP 패턴: {draft}"

  - id: critique-performance
    agent: claude-haiku-4-5
    prompt: "초안을 성능 관점에서 비판. bottleneck·O(n^2)·메모리: {draft}"

  - id: critique-readability
    agent: claude-haiku-4-5
    prompt: "초안을 가독성 관점에서 비판. 변수명·구조·주석·복잡도: {draft}"

  - id: synthesize
    agent: claude-opus-4-8
    prompt: "3개 critique 를 통합해 최종안. 초안: {draft}, 비판: {critiques}"

edges:
  - from: draft
    to: [critique-security, critique-performance, critique-readability]   # fan-out
  - from: [critique-security, critique-performance, critique-readability]
    to: synthesize                                                         # fan-in

state:
  - input: str
  - draft: str
  - critiques: list[str]
  - final: str
