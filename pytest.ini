[pytest]
# Test discovery patterns
testpaths = .claude/scripts/tests plugins/*/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Verbosity & reporting
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage settings
    --cov=.claude/scripts
    --cov=plugins
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=json:coverage.json
    --cov-fail-under=80
    --cov-branch

# Parallel execution (optional)
# addopts = -n auto

# Timeout (prevent hanging tests)
timeout = 300

# Markers for organizing tests
markers =
    unit: Unit tests (no external deps)
    integration: Integration tests (may need services)
    smoke: Smoke/sanity tests (quick validation)
    slow: Slow tests (performance/load)
    hook: Hook-specific tests
    mcp: MCP server tests
    skip_ci: Skip in CI environment

# Minimum Python version
minversion = 7.0

# Ignore deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Output options
console_output_style = progress
junit_family = xunit2

# Fixture scope defaults
tmpdir_factory = tempdir

# Coverage branch threshold
branch = true

# Exclude patterns
norecursedirs =
    .git
    .venv
    env
    build
    dist
    .tox
    setup/Output
    node_modules

# Test naming conventions
python_files = test_*.py *_test.py conftest.py
