# ----- 라우팅 임계값 (H1 참조 · 토큰 기반 범용화 scaffold) -----
# 모델 context_window 대비 비율로 결정 (예시 하드코딩 숫자 아님)
routing_thresholds:
  small_task_tokens: 2000  # 간단 작업 — Haiku
  medium_task_tokens: 20000  # 보통 — Sonnet
  large_task_tokens: 200000  # 대량 리서치 — Opus
  recall_task_tokens: 800000  # 초장기 recall — Gemini Flash
  # 각 모델 context_window 80% 이상 사용 시 다음 티어로 승격

# ----- Thinking budget (H2 참조) -----
# Opus 5+ 는 always_on (설정 X). 다른 모델만 effort 조정 가능.
thinking_budget:
  low: 2000
  medium: 4000  # default
  high: 8000
  xhigh: 16000
  mythos: 32000

# ----- Classifier 임계값 (H5 참조 · 토큰 기반) -----
classifier:
  implement_small_tokens: 2000  # 작은 구현 — Sonnet/Haiku
  implement_large_tokens: 20000  # 큰 구현 — Opus
  review_lines_min: 100  # 리뷰 최소 (예시 300 → 100 재조정 · 2026-10-28)
  parallel_file_threshold: 3  # 병렬 subagent 트리거 (3+ 파일)

# ----- 메타 -----
