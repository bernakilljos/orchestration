# AI Registry — 중앙 모델 매트릭스 (P0b H3+H4 · 2026-10-28)
#
# 근거: 하드코딩 감사
#   - H3 (route.py:231,252 fable-5 특수 분기 20% cap)
#   - H4 (router.py:43-51 AiChoice enum (7) vs route.py:113-124 status (8) 불일치)
#
# 원칙:
#   - 모델 추가·삭제 시 이 YAML 만 수정 (코드 변경 X)
#   - 모델별 실제 한도 (Anthropic·OpenAI·Google docs 기반) · 임의 숫자 X
#   - fable-5 등 특수 분기는 모델 자체 속성 (budget_cap_pct) 으로 표현
#   - 가용성·능력·비용을 각각 분리 (switch 분기 금지)
#
# 참조:
#   - .claude/scripts/route.py (status 체크 · _lookup_model(name))
#   - .claude/scripts/lib/router.py (라우팅 · AiChoice ↔ provider_id)
#   - .claude/scripts/classify-task.py (토큰 기반 분류 임계값)
#   - docs/HARDCODING_AUDIT_2026-10-28.md (H1~H7 발견 근거)

