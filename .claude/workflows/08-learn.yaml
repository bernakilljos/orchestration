name: learn
step: 8
trigger: after_verify_pass or after_repair_halt
description: solution 등재 + recurrence-tracker + memory 승격

inputs:
  - name: goal_id
  - name: outcome       # success | partial | fail | halted
  - name: files_modified
  - name: diff_report

steps:
  - id: save_solution
    desc: problem_solutions 테이블 저장 (solution-reuse.md · 2026-10-29 CLI 매칭)
    script: .claude/scripts/save_solution.py
    args: ["auto"]
    outputs: [solution_id]
  - id: recurrence_promote
    desc: 재발 1/2/3/5 자동 승격 (2026-10-29 CLI 매칭)
    script: .claude/scripts/recurrence-tracker.py
    args: ["stats"]
  - id: memory_candidate
    desc: feedback·project·reference 메모리 후보 제안 (사용자 승인 전까지 memory 반영 X · 2026-10-29 NEW)
    script: .claude/scripts/memory-candidate.py
    args: ["--goal", "{goal_id}", "--outcome", "{outcome}"]
  - id: standing_requirement_check
    desc: Standing Requirements 상태 조회 (자동 추가 금지 · 사용자 명시 add 만 · 2026-10-29 CLI 매칭)
    script: .claude/scripts/standing-requirements.py
    args: ["list"]
  - id: close_ledger
    desc: Request Ledger 상태 조회 (실 완료는 complete <rid> --evidence 수동 · 2026-10-29 CLI 매칭)
    script: .claude/scripts/request-ledger.py
    args: ["status"]

outputs:
  - learned: object
  - memory_updated: array
  - ledger_status: complete|partial

next_chain: null         # 체인 종료
on_failure: null          # 실패해도 종료 (learn 자체 무한 X)

notes:
  - Six Guards § 5 Quality Guard · § 4 Memory Guard 정합
  - 성공·실패 모두 learn (operating-principles § 8 재발=품질 실패)
