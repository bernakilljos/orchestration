# GitHub Personal Access Token
# - install.bat 이 이 파일을 읽어 GITHUB_PERSONAL_ACCESS_TOKEN 환경변수에 저장
#
# 사용법:
#   1. https://github.com/settings/tokens 에서 PAT 발급 (repo + workflow scope)
#   2. 아래 GITHUB_PAT= 다음에 본인 토큰 붙여넣기 (ghp_... 형식)
#   3. 절대 진짜 토큰 commit 하지 말 것 — GitHub push protection 이 차단함
#
# 진짜 토큰은 환경변수로 설정:
#   setx GITHUB_PERSONAL_ACCESS_TOKEN "ghp_YOUR_TOKEN_HERE"
#
# 또는 이 파일 로컬 사본에서만 직접 입력 (commit 안 함):
#   GITHUB_PAT=ghp_YOUR_TOKEN_HERE

GITHUB_PAT=ghp_REPLACE_WITH_YOUR_TOKEN
