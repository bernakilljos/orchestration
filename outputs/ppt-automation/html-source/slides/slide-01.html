<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Automation Tool — Cover</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="../styles/design-system.css" rel="stylesheet">
  <style>
    .cover { width: 1920px; height: 1080px; padding: 100px 120px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
      background-image:
        linear-gradient(115deg, rgba(15,18,24,0.78) 0%, rgba(60,42,22,0.62) 40%, rgba(138,98,53,0.45) 70%, rgba(184,134,78,0.30) 100%),
        url('https://source.unsplash.com/featured/1920x1080/?abstract,oil,painting,gold,dark,moody,art');
      background-size: cover, cover;
      background-position: center, center;
      color: #FAF5EA; }
    .cover::before { content: ''; position: absolute; left: 32px; top: 100px; bottom: 0; width: 50px; background: repeating-linear-gradient(0deg, rgba(184,134,78,0.05) 0px, rgba(184,134,78,0.05) 2px, transparent 2px, transparent 6px); border-radius: 25px; pointer-events: none; z-index: 2; }
    .cover::after { content: ''; position: absolute; right: 32px; top: 100px; bottom: 0; width: 50px; background: repeating-linear-gradient(180deg, rgba(107,142,127,0.05) 0px, rgba(107,142,127,0.05) 2px, transparent 2px, transparent 6px); border-radius: 25px; pointer-events: none; z-index: 2; }
    .cover .radial-overlay { content: ''; position: absolute; inset: 0; background:
      radial-gradient(ellipse 1200px 900px at 80% 25%, rgba(184,134,78,0.42) 0%, transparent 62%),
      radial-gradient(ellipse 900px 700px at 5% 90%, rgba(122,78,107,0.28) 0%, transparent 58%);
      mix-blend-mode: screen; pointer-events: none; z-index: 1; }
    .cover .grid-overlay { content: ''; position: absolute; inset: 0; background-image: linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(0deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 60px 60px; opacity: 0.35; mask-image: radial-gradient(ellipse at center, black, transparent 70%); pointer-events: none; z-index: 1; }
    .top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 3; }
    .brand { font-family: 'JetBrains Mono', monospace; font-size: 21px; letter-spacing: 0.32em; color: #FFE9B8; font-weight: 700; text-shadow: 0 2px 14px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.4); }
    .tag { padding: 10px 22px; background: rgba(255,255,255,0.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.35); border-radius: 100px; font-size: 19px; color: #FFFFFF; font-weight: 600; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    .center { position: relative; z-index: 3; }
    .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 21px; letter-spacing: 0.32em; color: #FFD580; font-weight: 700; margin-bottom: 28px; text-shadow: 0 2px 14px rgba(0,0,0,0.85), 0 0 24px rgba(0,0,0,0.5); }
    .title { font-family: 'Fraunces', serif; font-size: 200px; line-height: 0.92; letter-spacing: -0.04em; color: #FAF5EA; font-weight: 300; text-shadow: 0 4px 24px rgba(0,0,0,0.45); }
    .title .accent { color: #F0C97E; font-weight: 600; font-size: 240px; display: block; margin-top: -25px; text-shadow: 0 6px 32px rgba(184,134,78,0.6); }
    .sub { font-size: 30px; color: rgba(250,245,234,0.92); line-height: 1.5; max-width: 1100px; margin-top: 24px; text-shadow: 0 2px 16px rgba(0,0,0,0.5); }
    .footer { position: relative; z-index: 3; display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; padding: 28px 36px; background: rgba(26,29,36,0.32); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; box-shadow: 0 12px 48px rgba(0,0,0,0.25); }
    .stat .label { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.22em; color: #FFE9B8; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,0.5); }
    .stat .value { font-family: 'Fraunces', serif; font-size: 38px; font-weight: 600; color: #FFFFFF; text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div class="cover">
    <div class="top">
      <span class="brand">ORCHESTRATION KIT · AUTOMATION GUIDE · 2025.04</span>
      <span class="tag">● MAINTAINER</span>
    </div>
    <div class="center">
      <div class="eyebrow">▸ MULTI-AI · 24/7 · COST-AWARE</div>
      <h1 class="title">Automation<span class="accent">도구</span></h1>
      <p class="sub">Claude Opus 4.7 (설계) + Codex (구현) + Haiku 4.5 (검증).<br>SQLite 상태머신 · Watchdog · Quota Backoff · Budget Ceiling.</p>
    </div>
    <div class="footer">
      <div class="stat"><div class="label">AI Models</div><div class="value">3</div></div>
      <div class="stat"><div class="label">Workers</div><div class="value">4×</div></div>
      <div class="stat"><div class="label">Uptime</div><div class="value">24/7</div></div>
      <div class="stat"><div class="label">State Tables</div><div class="value">8</div></div>
      <div class="stat"><div class="label">Cost Saving</div><div class="value">90%</div></div>
    </div>
  </div>
</body>
</html>
