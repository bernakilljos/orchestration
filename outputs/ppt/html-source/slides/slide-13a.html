<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PART 03 · ECOSYSTEM</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="../styles/design-system.css" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  <style>
    .divider { width: 1920px; height: 1080px; padding: 100px 120px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; background: radial-gradient(ellipse 1100px 800px at 80% 80%, rgba(122,78,107,0.30) 0%, transparent 60%), radial-gradient(ellipse 800px 600px at 10% 20%, rgba(184,134,78,0.18) 0%, transparent 55%), linear-gradient(180deg, #F5EFEF 0%, #E5DAE0 100%); }
    .divider .top { display: flex; justify-content: space-between; align-items: center; }
    .divider .brand { font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 0.3em; color: #5A3850; font-weight: 600; }
    .divider .pageno { font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #6E685C; }
    .divider .center { display: flex; flex-direction: column; gap: 32px; }
    .divider .partlabel { font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: 0.4em; color: #7A4E6B; font-weight: 700; }
    .divider .bigicon { font-size: 220px; color: #7A4E6B; }
    .divider .bigtitle { font-family: 'Fraunces', serif; font-size: 220px; line-height: 0.92; letter-spacing: -0.04em; color: #1A1D24; font-weight: 600; }
    .divider .bigtitle .accent { color: #7A4E6B; font-style: italic; font-weight: 500; display: block; font-size: 250px; margin-top: -20px; }
    .divider .lead { font-size: 36px; color: #6E685C; line-height: 1.4; max-width: 1200px; }
    .divider .bottom { display: flex; align-items: center; justify-content: space-between; padding-top: 30px; border-top: 0.5px solid rgba(122,78,107,0.4); font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #6E685C; }
    .divider .chapters { display: flex; gap: 24px; }
    .divider .chapters .ch { padding: 6px 14px; background: rgba(255,255,255,0.7); border: 0.5px solid rgba(122,78,107,0.3); border-radius: 100px; }
    .divider .chapters .ch.active { background: #7A4E6B; color: white; border-color: #7A4E6B; font-weight: 700; }
    .divider .deco-grid { position: absolute; right: -100px; top: 30%; display: grid; grid-template-columns: repeat(8, 12px); gap: 22px; opacity: 0.25; }
    .divider .deco-grid span { width: 12px; height: 12px; background: #7A4E6B; border-radius: 50%; }
  </style>
</head>
<body>
  <div class="divider">
    <div class="top">
      <span class="brand">CLAUDE CODE · ARCHITECTURE</span>
      <span class="pageno">21 / 40</span>
    </div>
    <div class="center">
      <div class="partlabel">▸ PART 03 · ECOSYSTEM</div>
      <iconify-icon icon="heroicons:link" class="bigicon"></iconify-icon>
      <h1 class="bigtitle">외부<span class="accent">연결</span></h1>
      <p class="lead">출력 스타일 · MCP 서버 · 플러그인 마켓.<br>Claude 를 둘러싼 도구 생태계.</p>
    </div>
    <div class="bottom">
      <div class="chapters">
        <span class="ch">01 · WHY</span>
        <span class="ch">02 · FOLDER</span>
        <span class="ch active">03 · ECOSYSTEM</span>
        <span class="ch">04 · FRAMEWORK</span>
        <span class="ch">05 · PRACTICE</span>
      </div>
      <span>다음 → 출력 스타일 + 상태바</span>
    </div>
    <div class="deco-grid"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</body>
</html>
