<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code 설계 - Cover</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="../styles/design-system.css" rel="stylesheet">
  <style>
    .cover {
      width: 1920px;
      height: 1080px;
      background:
        radial-gradient(ellipse 900px 700px at 85% 15%, rgba(184, 134, 78, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse 700px 500px at 10% 85%, rgba(107, 142, 127, 0.15) 0%, transparent 55%),
        linear-gradient(180deg, #FAF5EA 0%, #E8DEC8 100%);
      position: relative;
      overflow: hidden;
      padding: 100px 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(26, 29, 36, 0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(26, 29, 36, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.6;
      mask-image: radial-gradient(ellipse at center, black, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* 상단 메타 */
    .cover-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
      margin-bottom: 60px;
    }

    .cover-brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.3em;
      color: #8A6235;
      font-weight: 600;
      text-transform: uppercase;
    }

    .cover-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border: 0.5px solid rgba(184, 134, 78, 0.3);
      border-radius: 100px;
      font-size: 13px;
      color: #6E685C;
      font-weight: 500;
    }

    /* 메인 콘텐츠 */
    .cover-main {
      position: relative;
      z-index: 2;
      margin-bottom: 100px;
    }

    .cover-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #8A6235;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .cover-title {
      font-family: 'Fraunces', serif;
      font-size: 180px;
      font-weight: 300;
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: #1A1D24;
      margin-bottom: 24px;
    }

    .cover-title .accent {
      color: #B8864E;
      font-style: italic;
      font-weight: 600;
      font-size: 240px;
      display: block;
      margin-top: -40px;
      margin-bottom: 20px;
    }

    .cover-sub {
      font-family: 'Pretendard Variable', sans-serif;
      font-size: 28px;
      font-weight: 400;
      color: #6E685C;
      line-height: 1.5;
      max-width: 900px;
    }

    /* 하단 스탯 */
    .cover-footer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      position: relative;
      z-index: 2;
    }

    .stat-item .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #6E685C;
      margin-bottom: 8px;
    }

    .stat-item .value {
      font-family: 'Fraunces', serif;
      font-size: 30px;
      font-weight: 500;
      color: #1A1D24;
    }

    /* 장식 — 우하단 도형 */
    .decor-dots {
      position: absolute;
      bottom: 100px;
      right: 120px;
      display: grid;
      grid-template-columns: repeat(6, 12px);
      gap: 16px;
      opacity: 0.35;
      z-index: 1;
    }

    .decor-dots span {
      width: 12px;
      height: 12px;
      background: #B8864E;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="cover-top">
      <div class="cover-brand">CLAUDE CODE · ARCHITECTURE · 2025.04</div>
      <div class="cover-tag">● REFERENCE</div>
    </div>

    <div class="cover-main">
      <div class="cover-eyebrow">KOREA · DESIGN REFERENCE · OPUS 4.7 BASELINE</div>
      <h1 class="cover-title">
        Claude Code
        <span class="accent">설계</span>
      </h1>
      <p class="cover-sub">
        폴더 구조 · /init 원리 · 메모리 · 훅 · 플러그인<br>
        Opus 4.7 기준 (2025년 4월)
      </p>
    </div>

    <div class="cover-footer">
      <div class="stat-item">
        <div class="label">Sections</div>
        <div class="value">5</div>
      </div>
      <div class="stat-item">
        <div class="label">Slides</div>
        <div class="value">27</div>
      </div>
      <div class="stat-item">
        <div class="label">Framework</div>
        <div class="value">WHAT/WHY/HOW</div>
      </div>
      <div class="stat-item">
        <div class="label">Baseline</div>
        <div class="value">Opus 4.7</div>
      </div>
    </div>

    <div class="decor-dots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

    <svg viewBox="0 0 400 400" class="cover-illustration" style="width: 280px; height: 280px;">
  <!-- 폴더 3개 레이어 (Figma 스타일 flat) -->
  <rect x="60" y="200" width="280" height="180" rx="16" fill="#E5DDCA" stroke="#B8864E" stroke-width="2"/>
  <rect x="80" y="160" width="280" height="180" rx="16" fill="#EDE4D3" stroke="#8A6235" stroke-width="2"/>
  <rect x="100" y="120" width="280" height="180" rx="16" fill="#F7F2EA" stroke="#1A1D24" stroke-width="3"/>
  <!-- 폴더 탭 -->
  <rect x="100" y="108" width="80" height="20" rx="4" fill="#1A1D24"/>
  <!-- 파일 아이콘 -->
  <rect x="130" y="150" width="60" height="80" rx="4" fill="white" stroke="#B8864E" stroke-width="1.5"/>
  <line x1="140" y1="170" x2="180" y2="170" stroke="#B8864E" stroke-width="1"/>
  <line x1="140" y1="180" x2="170" y2="180" stroke="#B8864E" stroke-width="1"/>
  <!-- 장식 점 -->
  <circle cx="350" cy="80" r="8" fill="#D4A574"/>
  <circle cx="380" cy="100" r="4" fill="#6B8E7F"/>
</svg>
</body>
</html>
