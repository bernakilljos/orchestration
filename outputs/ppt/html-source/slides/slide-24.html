<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Slide 24 - Closing</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="../styles/design-system.css" rel="stylesheet">
  <style>
    .closing {
      width: 1920px;
      height: 1080px;
      background:
        radial-gradient(ellipse 1200px 700px at 80% 40%, rgba(122, 78, 107, 0.10) 0%, transparent 60%),
        radial-gradient(ellipse 900px 600px at 10% 70%, rgba(107, 142, 127, 0.08) 0%, transparent 60%),
        linear-gradient(180deg, #F7F2EA 0%, #EDE4D3 100%);
      position: relative;
      overflow: hidden;
      padding: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .closing::before {
      content: '';
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(122, 78, 107, 0.12) 0%, transparent 70%);
      z-index: 0;
    }

    .closing::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(184, 134, 78, 0.03) 1px, transparent 1px),
        linear-gradient(0deg, rgba(184, 134, 78, 0.03) 1px, transparent 1px);
      background-size: 100px 100px;
      pointer-events: none;
      z-index: 0;
    }

    .closing-content {
      position: relative;
      z-index: 2;
      max-width: 1200px;
    }

    .closing-quote {
      font-family: 'Fraunces', serif;
      font-size: 140px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #1A1D24;
      margin-bottom: 48px;
    }

    .closing-quote .accent {
      color: #7A4E6B;
      font-style: italic;
      font-weight: 500;
    }

    .closing-signature {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #6E685C;
      font-weight: 600;
      margin-top: 32px;
    }

    .decor-line {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, #B8864E 0%, transparent 100%);
      margin: 0 auto 40px;
    }
  </style>
</head>
<body>
  <div class="closing">
    <div class="closing-content">
      <div class="decor-line"></div>
      <h1 class="closing-quote">
        Built before<br>
        <span class="accent">Opus 4.7</span>.<br>
        Evolved after.
      </h1>
      <p class="closing-signature">— Orchestration Kit v1.0</p>
    </div>
  </div>
</body>
</html>
