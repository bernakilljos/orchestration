<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn More</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="../styles/design-system.css" rel="stylesheet">
  <style>
    .closing {
      width: 1920px;
      height: 1080px;
      background: linear-gradient(180deg, #F7F2EA 0%, #EDE4D3 100%);
      position: relative;
      overflow: hidden;
      padding: 100px 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .closing-title {
      font-family: 'Fraunces', serif;
      font-size: 160px;
      font-weight: 600;
      line-height: 0.92;
      color: #1A1D24;
      margin-bottom: 24px;
    }
    .closing-sub {
      font-size: 32px;
      color: #6E685C;
      margin-bottom: 64px;
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-bottom: 64px;
    }
    .link-item {
      padding: 24px;
      background: rgba(255, 255, 255, 0.6);
      border: 0.5px solid var(--fog);
      border-radius: 12px;
    }
    .link-item a {
      font-size: 24px;
      color: #B8864E;
      text-decoration: none;
      font-weight: 600;
    }
    .link-item a:hover {
      text-decoration: underline;
    }
    .link-desc {
      font-size: 14px;
      color: #6E685C;
      margin-top: 8px;
    }
    .closing-footer {
      font-size: 14px;
      color: #6E685C;
      border-top: 0.5px solid var(--fog);
      padding-top: 24px;
    }
  </style>
</head>
<body>
  <div class="closing">
    <div>
      <h1 class="closing-title">Learn More</h1>
      <p class="closing-sub">공식 문서 + 커뮤니티 리소스</p>

      <div class="links-grid">
        <div class="link-item">
          <a style="font-size: 36px !important; font-weight: 600;" href="#">docs.claude.com/claude-code</a>
          <div class="link-desc">공식 가이드</div>
        </div>
        <div class="link-item">
          <a style="font-size: 36px !important; font-weight: 600;" href="#">github.com/anthropics/claude-code</a>
          <div class="link-desc">공식 리포</div>
        </div>
        <div class="link-item">
          <a style="font-size: 36px !important; font-weight: 600;" href="#">github.com/anthropics/skills</a>
          <div class="link-desc">스킬 라이브러리</div>
        </div>
        <div class="link-item">
          <a style="font-size: 36px !important; font-weight: 600;" href="#">DK.method by Brij Kishore Pandey</a>
          <div class="link-desc">CLAUDE.md 설계 프레임</div>
        </div>
      </div>
    </div>

    <div class="closing-footer">
      Created with Claude Code · Architecture Reference v1.0<br>
      <span style="color: #B8864E; font-weight: 600;">감사: Brij Kishore Pandey 의 CLAUDE.md 설계 프레임</span>
    </div>
  </div>

    <svg viewBox="0 0 800 200" class="link-icons" style="width: 100%; max-width: 800px; height: auto;">
  <!-- 4개 링크 아이콘 + 텍스트 -->
  <g font-family="'Pretendard Variable'" text-anchor="middle">
    <!-- GitHub -->
    <rect x="20" y="20" width="160" height="140" rx="8" fill="white" stroke="#B8864E" stroke-width="2"/>
    <circle cx="100" cy="60" r="20" fill="#1A1D24"/>
    <path d="M90,50 L100,60 L110,70 M110,50 L100,60 L90,70" stroke="white" stroke-width="2" fill="none"/>
    <text x="100" y="120" font-size="18" font-weight="700" fill="#1A1D24">GitHub</text>

    <!-- Docs -->
    <rect x="210" y="20" width="160" height="140" rx="8" fill="white" stroke="#B8864E" stroke-width="2"/>
    <rect x="260" y="45" width="40" height="50" rx="2" fill="#F7F2EA" stroke="#B8864E" stroke-width="2"/>
    <line x1="270" y1="60" x2="290" y2="60" stroke="#B8864E" stroke-width="1.5"/>
    <line x1="270" y1="70" x2="285" y2="70" stroke="#B8864E" stroke-width="1.5"/>
    <text x="290" y="120" font-size="18" font-weight="700" fill="#1A1D24">Docs</text>

    <!-- API -->
    <rect x="400" y="20" width="160" height="140" rx="8" fill="white" stroke="#B8864E" stroke-width="2"/>
    <circle cx="480" cy="60" r="18" fill="none" stroke="#B8864E" stroke-width="2"/>
    <path d="M480,45 L480,75" stroke="#B8864E" stroke-width="2"/>
    <path d="M465,60 L495,60" stroke="#B8864E" stroke-width="2"/>
    <text x="480" y="120" font-size="18" font-weight="700" fill="#1A1D24">API</text>

    <!-- Setup -->
    <rect x="590" y="20" width="160" height="140" rx="8" fill="white" stroke="#B8864E" stroke-width="2"/>
    <path d="M640,45 L665,65 L640,75 Z" fill="#B8864E"/>
    <circle cx="650" cy="65" r="8" fill="none" stroke="#B8864E" stroke-width="2"/>
    <text x="670" y="120" font-size="18" font-weight="700" fill="#1A1D24">Setup</text>
  </g>
</svg>
</body>
</html>
