<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn More</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="../styles/design-system.css" rel="stylesheet">
  <style>
    .closing {
      width: 1920px;
      height: 1080px;
      background: linear-gradient(180deg, #F7F2EA 0%, #EDE4D3 100%);
      position: relative;
      overflow: hidden;
      padding: 100px 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .closing-title {
      font-family: 'Fraunces', serif;
      font-size: 160px;
      font-weight: 600;
      line-height: 0.92;
      color: #1A1D24;
      margin-bottom: 24px;
    }
    .closing-sub {
      font-size: 32px;
      color: #6E685C;
      margin-bottom: 64px;
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-bottom: 64px;
    }
    .link-item {
      padding: 24px;
      background: rgba(255, 255, 255, 0.6);
      border: 0.5px solid var(--fog);
      border-radius: 12px;
    }
    .link-item a {
      font-size: 18px;
      color: #B8864E;
      text-decoration: none;
      font-weight: 600;
    }
    .link-item a:hover {
      text-decoration: underline;
    }
    .link-desc {
      font-size: 14px;
      color: #6E685C;
      margin-top: 8px;
    }
    .closing-footer {
      font-size: 14px;
      color: #6E685C;
      border-top: 0.5px solid var(--fog);
      padding-top: 24px;
    }
  </style>
</head>
<body>
  <div class="closing">
    <div>
      <h1 class="closing-title">Learn More</h1>
      <p class="closing-sub">공식 문서 + 커뮤니티 리소스</p>

      <div class="links-grid">
        <div class="link-item">
          <a href="#">docs.claude.com/claude-code</a>
          <div class="link-desc">공식 가이드</div>
        </div>
        <div class="link-item">
          <a href="#">github.com/anthropics/claude-code</a>
          <div class="link-desc">공식 리포</div>
        </div>
        <div class="link-item">
          <a href="#">github.com/anthropics/skills</a>
          <div class="link-desc">스킬 라이브러리</div>
        </div>
        <div class="link-item">
          <a href="#">DK.method by Brij Kishore Pandey</a>
          <div class="link-desc">CLAUDE.md 설계 프레임</div>
        </div>
      </div>
    </div>

    <div class="closing-footer">
      Created with Claude Code · Architecture Reference v1.0<br>
      <span style="color: #B8864E; font-weight: 600;">감사: Brij Kishore Pandey 의 CLAUDE.md 설계 프레임</span>
    </div>
  </div>
</body>
</html>
