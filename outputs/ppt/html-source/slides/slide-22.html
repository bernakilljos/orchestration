<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Slide 22 - 현재 상태</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="../styles/design-system.css" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
</head>
<body>
  <div class="slide part-3">
    <div class="slide-header">
      <span class="eyebrow">현재 라이브 수치</span>
      <span class="mono caption">22 / 25</span>
    </div>

    <div class="main-content">
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 32px;">
        <!-- Plugins -->
        <div style="background: rgba(107, 142, 127, 0.08); border: 0.5px solid #6B8E7F; border-radius: 12px; padding: 24px; text-align: center;">
          <iconify-icon icon="mdi:puzzle" class="icon-xl icon-success"></iconify-icon>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 56px; font-weight: 800; color: #6B8E7F; margin: 16px 0; line-height: 1;">25</div>
          <div style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); font-weight: 600;">Plugins</div>
        </div>

        <!-- State Tables -->
        <div style="background: rgba(107, 142, 127, 0.08); border: 0.5px solid #6B8E7F; border-radius: 12px; padding: 24px; text-align: center;">
          <iconify-icon icon="mdi:database" class="icon-xl icon-success"></iconify-icon>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 56px; font-weight: 800; color: #6B8E7F; margin: 16px 0; line-height: 1;">8</div>
          <div style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); font-weight: 600;">DB Tables</div>
        </div>

        <!-- Code Lines -->
        <div style="background: rgba(107, 142, 127, 0.08); border: 0.5px solid #6B8E7F; border-radius: 12px; padding: 24px; text-align: center;">
          <iconify-icon icon="mdi:code-braces" class="icon-xl icon-success"></iconify-icon>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 800; color: #6B8E7F; margin: 16px 0; line-height: 1;">2.1k</div>
          <div style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); font-weight: 600;">Code Lines</div>
        </div>

        <!-- Tests -->
        <div style="background: rgba(107, 142, 127, 0.08); border: 0.5px solid #6B8E7F; border-radius: 12px; padding: 24px; text-align: center;">
          <iconify-icon icon="mdi:check-circle" class="icon-xl icon-success"></iconify-icon>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 56px; font-weight: 800; color: #6B8E7F; margin: 16px 0; line-height: 1;">33</div>
          <div style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); font-weight: 600;">Tests Pass</div>
        </div>

        <!-- Cache Hits -->
        <div style="background: rgba(107, 142, 127, 0.08); border: 0.5px solid #6B8E7F; border-radius: 12px; padding: 24px; text-align: center;">
          <iconify-icon icon="mdi:lightning-bolt" class="icon-xl icon-success"></iconify-icon>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 800; color: #6B8E7F; margin: 16px 0; line-height: 1;">68%</div>
          <div style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); font-weight: 600;">Cache Hit</div>
        </div>

        <!-- Workers -->
        <div style="background: rgba(107, 142, 127, 0.08); border: 0.5px solid #6B8E7F; border-radius: 12px; padding: 24px; text-align: center;">
          <iconify-icon icon="mdi:worker-threads" class="icon-xl icon-success"></iconify-icon>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 56px; font-weight: 800; color: #6B8E7F; margin: 16px 0; line-height: 1;">4</div>
          <div style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); font-weight: 600;">Workers</div>
        </div>

        <!-- Daily Spend -->
        <div style="background: rgba(107, 142, 127, 0.08); border: 0.5px solid #6B8E7F; border-radius: 12px; padding: 24px; text-align: center;">
          <iconify-icon icon="mdi:currency-usd" class="icon-xl icon-success"></iconify-icon>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 800; color: #6B8E7F; margin: 16px 0; line-height: 1;">$50.91</div>
          <div style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); font-weight: 600;">Today Cost</div>
        </div>

        <!-- Uptime -->
        <div style="background: rgba(107, 142, 127, 0.08); border: 0.5px solid #6B8E7F; border-radius: 12px; padding: 24px; text-align: center;">
          <iconify-icon icon="mdi:shield-check" class="icon-xl icon-success"></iconify-icon>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 800; color: #6B8E7F; margin: 16px 0; line-height: 1;">100%</div>
          <div style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); font-weight: 600;">Uptime</div>
        </div>
      </div>
    </div>

    <div class="side-panel">
      <div class="bullet-box part-3">
        <h3>🎯 상태 요약</h3>
        <ul>
          <li>모든 구성 요소: 정상</li>
          <li>캐시 성능: 최적화</li>
          <li>비용 관리: 효율</li>
          <li>시스템 안정: 높음</li>
          <li>자동화: 24/7</li>
        </ul>
        <hr>
        <div style="background: rgba(107, 142, 127, 0.08); padding: 12px; border-radius: 8px; font-size: 15px; color: var(--ink); line-height: 1.5;">
          업데이트: 2026-04-24 09:00 KST
        </div>
      </div>
    </div>
  </div>
</body>
</html>
