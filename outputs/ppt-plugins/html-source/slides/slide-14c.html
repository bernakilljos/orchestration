<!DOCTYPE html>

<style>

  </div>
  <div class="title-with-icon"><iconify-icon icon="heroicons:server-stack" class="icon-lg"></iconify-icon><h1 class="heading-1">Claude Code 아키텍처 레퍼런스</h1></div>
  <p class="body-lead" style="margin-top:6px; color:var(--stone);">Pandey 표준 — 26 플러그인은 5 영역에 매핑 (Hook · Skill · Command · Agent · Plugin)</p>

          <linearGradient id="agAG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D17B5C"/><stop offset="100%" stop-color="#B25A3E"/></linearGradient>

        <text x="850" y="40" text-anchor="middle" font-family="Fraunces" font-size="28" font-weight="700" fill="#1A1D24">Claude Code 5 영역 — Anthropic 공식 표준</text>

          <path d="M 800 200 L 600 320"/>
          <path d="M 900 200 L 1100 320"/>
          <path d="M 1000 200 L 1480 320"/>

        <text x="230" y="466" text-anchor="middle" font-family="Fraunces" font-size="20" font-weight="700" fill="#FFD580">110+ 명령</text>

        <rect x="440" y="280" width="380" height="200" rx="16" fill="url(#skAG)" stroke="#1A1D24" stroke-width="2"/>
        <text x="630" y="320" text-anchor="middle" font-family="Fraunces" font-size="26" font-weight="700" fill="#FAF5EA">SKILLS</text>

        <text x="630" y="412" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#FAF5EA" opacity="0.78">route_dispatch · ai-handoff</text>
        <text x="630" y="438" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#FAF5EA" opacity="0.78">arch-auto · skill-creator</text>
        <text x="630" y="466" text-anchor="middle" font-family="Fraunces" font-size="20" font-weight="700" fill="#FFD580">38+ 스킬</text>

        <rect x="840" y="280" width="380" height="200" rx="16" fill="url(#hkAG)" stroke="#1A1D24" stroke-width="2"/>
        <text x="1030" y="320" text-anchor="middle" font-family="Fraunces" font-size="26" font-weight="700" fill="#FAF5EA">HOOKS</text>
        <text x="1030" y="352" text-anchor="middle" font-family="JetBrains Mono" font-size="15" fill="#FAF5EA" opacity="0.92">▸ 이벤트 자동 실행</text>
        <text x="1030" y="385" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="#FAF5EA" opacity="0.85">100% 강제 (메모리 7~80%)</text>
        <text x="1030" y="412" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#FAF5EA" opacity="0.78">PreToolUse · PostToolUse</text>

        <text x="1030" y="466" text-anchor="middle" font-family="Fraunces" font-size="20" font-weight="700" fill="#FFD580">11 hooks</text>

        <text x="1430" y="412" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#FAF5EA" opacity="0.78">team-lead · implementer</text>
        <text x="1430" y="438" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#FAF5EA" opacity="0.78">reviewer · architect</text>
        <text x="1430" y="466" text-anchor="middle" font-family="Fraunces" font-size="20" font-weight="700" fill="#FFD580">6 agents</text>

        <text x="850" y="580" text-anchor="middle" font-family="Fraunces" font-size="24" font-weight="700" fill="#8A6235">▸ PLUGIN = (commands + skills + hooks + agents) × 1 plugin.json</text>
        <text x="850" y="615" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#5A3B50">한 슬래시 명령으로 4 종 도구가 동시 동작</text>

        <!-- 4 examples -->
        <text x="280" y="660" text-anchor="middle" font-family="Fraunces" font-size="18" font-weight="700" fill="#1A1D24">/design_ppt 실행</text>
        <text x="280" y="685" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#6E685C">design_ppt 플러그인 활성</text>
        <text x="280" y="708" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#8A6235">commands + skills 함께</text>

        <text x="660" y="660" text-anchor="middle" font-family="Fraunces" font-size="18" font-weight="700" fill="#1A1D24">/exec_orch 실행</text>
        <text x="660" y="685" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#6E685C">exec_orch 코어 활성</text>
        <text x="660" y="708" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#8A6235">+ hook-08 자동 검증</text>

        <text x="1040" y="660" text-anchor="middle" font-family="Fraunces" font-size="18" font-weight="700" fill="#1A1D24">PreTool 자동</text>
        <text x="1040" y="685" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#6E685C">권한 체크 (settings.json)</text>
        <text x="1040" y="708" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#8A6235">차단 시 사용자 알림</text>

        <text x="1420" y="660" text-anchor="middle" font-family="Fraunces" font-size="18" font-weight="700" fill="#1A1D24">코드 리뷰 시</text>
        <text x="1420" y="685" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#6E685C">reviewer agent 호출</text>
        <text x="1420" y="708" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#8A6235">독립 컨텍스트로 분석</text>
      </svg>
