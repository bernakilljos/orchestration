<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>TEAM — Cover</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="../styles/design-system.css" rel="stylesheet">
  <style>
    .cover { width: 1920px; height: 1080px; padding: 100px 120px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
      background-image:
        linear-gradient(115deg, rgba(15,24,18,0.78) 0%, rgba(40,70,55,0.62) 40%, rgba(74,111,96,0.45) 70%, rgba(107,142,127,0.30) 100%),
        url('https://source.unsplash.com/featured/1920x1080/?abstract,oil,painting,forest,dark,moody,art');
      background-size: cover, cover; background-position: center, center; color: #F4F1E5; }
    .cover::before { content: ''; position: absolute; inset: 0; background:
      radial-gradient(ellipse 1200px 900px at 20% 25%, rgba(107,142,127,0.45) 0%, transparent 60%),
      radial-gradient(ellipse 900px 700px at 90% 90%, rgba(184,134,78,0.25) 0%, transparent 55%);
      mix-blend-mode: screen; pointer-events: none; z-index: 1; }
    .cover::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(0deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 60px 60px; opacity: 0.35; mask-image: radial-gradient(ellipse at center, black, transparent 70%); pointer-events: none; z-index: 1; }
    .top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 3; }
    .brand { font-family: 'JetBrains Mono', monospace; font-size: 21px; letter-spacing: 0.32em; color: #DCEEDE; font-weight: 700; text-shadow: 0 2px 14px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.4); }
    .tag { padding: 10px 22px; background: rgba(255,255,255,0.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.35); border-radius: 100px; font-size: 19px; color: #FFFFFF; font-weight: 600; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    .center { position: relative; z-index: 3; }
    .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 21px; letter-spacing: 0.32em; color: #C8E6CD; font-weight: 700; margin-bottom: 28px; text-shadow: 0 2px 14px rgba(0,0,0,0.85), 0 0 24px rgba(0,0,0,0.5); }
    .title { font-family: 'Fraunces', serif; font-size: 200px; line-height: 0.92; letter-spacing: -0.04em; color: #F4F1E5; font-weight: 300; text-shadow: 0 4px 24px rgba(0,0,0,0.45); }
    .title .accent { color: #B5D4BC; font-weight: 600; font-size: 240px; display: block; margin-top: -25px; text-shadow: 0 6px 32px rgba(107,142,127,0.6); }
    .sub { font-size: 30px; color: rgba(244,241,229,0.92); line-height: 1.5; max-width: 1100px; margin-top: 24px; text-shadow: 0 2px 16px rgba(0,0,0,0.5); }
    .footer { position: relative; z-index: 3; display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; padding: 28px 36px; background: rgba(26,40,32,0.32); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; box-shadow: 0 12px 48px rgba(0,0,0,0.25); }
    .stat .label { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.22em; color: #DCEEDE; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,0.5); }
    .stat .value { font-family: 'Fraunces', serif; font-size: 38px; font-weight: 600; color: #FFFFFF; text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div class="cover">
    <div class="top">
      <span class="brand">ORCHESTRATION KIT · TEAM EDITION · 2025.04</span>
      <span class="tag">● TEAM DEPLOYMENT</span>
    </div>
    <div class="center">
      <div class="eyebrow">▸ 시크릿 없음 · 토큰 선택 · 깨끗한 설치</div>
      <h1 class="title">TEAM<span class="accent">배포본</span></h1>
      <p class="sub">팀에 그대로 배포 가능한 깨끗한 빌드 — 토큰 없어도 설치 진행.<br>본판의 모든 기능 + 시크릿 노출 0 보장.</p>
    </div>
    <div class="footer">
      <div class="stat"><div class="label">시크릿</div><div class="value">0</div></div>
      <div class="stat"><div class="label">토큰</div><div class="value">선택</div></div>
      <div class="stat"><div class="label">설치 시간</div><div class="value">5분</div></div>
      <div class="stat"><div class="label">플러그인</div><div class="value">25</div></div>
      <div class="stat"><div class="label">에디션</div><div class="value">v1.0</div></div>
    </div>
  </div>
</body>
</html>
