<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>생성</title><style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
body {
  width: 1080px; height: 1080px;
  background: linear-gradient(135deg, #0f1419 0%, #1a2540 100%);
  color: #e8eef5; padding: 50px 55px;
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}
body::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 10px;
  background: #ffd166;
}
.head { display: flex; align-items: center; gap: 24px; margin-bottom: 28px; }
.num { font-size: 70px; font-weight: 900; color: #ffd166; line-height: 1; }
.emoji { font-size: 110px; line-height: 1; }
.title-block { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.name { font-size: 70px; font-weight: 900; color: #fff; line-height: 1; }
.subtitle { font-size: 26px; color: #8a9bb0; }
.metaphor {
  background: rgba(255, 255, 255, 0.05);
  border-left: 5px solid #ffd166;
  padding: 20px 28px;
  border-radius: 6px;
  font-size: 30px;
  font-weight: 600;
  margin-bottom: 30px;
  color: #fff;
}
.steps { display: flex; flex-direction: column; gap: 18px; margin-bottom: 30px; flex: 1; }
.step {
  display: flex; align-items: center; gap: 18px;
  padding: 16px 22px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 12px;
  border-left: 4px solid #3a4660;
}
.step.now {
  background: rgba(255, 255, 255, 0.09);
  border-left-color: #ffd166;
  box-shadow: 0 0 24px #ffd16633;
}
.step.past { opacity: 0.5; }
.step.future { opacity: 0.7; border-left-style: dashed; }
.step .dot { width: 16px; height: 16px; border-radius: 50%; background: #5a6a85; flex-shrink: 0; }
.step.now .dot { background: #ffd166; box-shadow: 0 0 12px #ffd166; }
.step.future .dot { background: transparent; border: 2px dashed #8a9bb0; }
.step-text { font-size: 28px; font-weight: 700; color: #fff; flex: 1; }
.step.past .step-text { color: #8a9bb0; font-weight: 500; }
.step.future .step-text { color: #b8c3d6; font-style: italic; }
.step-year { font-size: 20px; color: #8a9bb0; font-weight: 600; }
.step.now .step-year { color: #ffd166; font-weight: 800; }
.why {
  background: rgba(255, 209, 102, 0.08);
  border-left: 4px solid #ffd166;
  padding: 18px 24px;
  border-radius: 6px;
  font-size: 22px;
  color: #fff;
  margin-bottom: 14px;
  line-height: 1.45;
}
.why-label { color: #ffd166; font-weight: 800; margin-right: 6px; }
.real { font-size: 17px; color: #8a9bb0; font-style: italic; }
.real-label { color: #aab8cc; font-style: normal; font-weight: 700; margin-right: 4px; }
.footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 16px; border-top: 1px solid #2a3548; font-size: 16px; color: #6a7a90; }
.brand { color: #ffd166; font-weight: 700; }
</style></head><body>
  <div class="head">
    <div class="num">03</div>
    <div class="emoji">📝</div>
    <div class="title-block">
      <div class="name">생성</div>
      <div class="subtitle">AI 가 답을 만드는 방식</div>
    </div>
  </div>
  <div class="metaphor">✍️ 한 글자씩 → 🎨 그림처럼 한 방에</div>
  <div class="steps"><div class="step past"><div class="dot"></div><div class="step-text">Autoregressive (한 글자씩)</div><div class="step-year">~2025</div></div><div class="step now"><div class="dot"></div><div class="step-text">Diffusion LLM</div><div class="step-year">2026 ★</div></div><div class="step future"><div class="dot"></div><div class="step-text">Hybrid 결합</div><div class="step-year">2027</div></div></div>
  <div class="why"><span class="why-label">왜?</span>Agent 시대 = 긴 답 폭증 → 10배 빠르게 + 비용 1/10</div>
  <div class="real"><span class="real-label">대표:</span>Inception Mercury 2, LLaDA-8B (open-source)</div>
  <div class="footer">
    <span>AI 진화 10가족 · 학습 카드</span>
    <span class="brand">03 · 2026-2030</span>
  </div>
</body></html>
