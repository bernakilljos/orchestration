name: Test Matrix (Python 3.11—3.14)

on:
  push:
    branches: [main, develop]
    paths:
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.claude/scripts/**/*.py'
      - 'plugins/**/*.py'
      - '.github/workflows/test-matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.claude/scripts/**/*.py'
      - 'plugins/**/*.py'
      - '.github/workflows/test-matrix.yml'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .claude/scripts plugins || true
          ruff format --check .claude/scripts plugins || true

      - name: Type check with mypy
        run: |
          pip install mypy types-PyYAML types-requests
          mypy .claude/scripts/lib/ plugins/exec_orch/skills/ --ignore-missing-imports || true

      - name: Run pytest
        run: |
          pytest .claude/scripts/tests plugins/*/tests -v --tb=short 2>/dev/null || \
          echo "⚠ No tests found or tests incomplete (development phase)"

      - name: Generate coverage report
        run: |
          pytest --cov=.claude/scripts --cov=plugins \
            --cov-report=xml --cov-report=html \
            -v --tb=short 2>/dev/null || \
          echo "⚠ Coverage partial (development phase)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Validate plugin schemas
        run: python .claude/scripts/validate-plugin-schema.py --strict || true

      - name: Dry-run install check
        run: bash .claude/scripts/smoke-test.sh || echo "⚠ Smoke test partial"

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black isort pylint

      - name: Check with ruff
        run: ruff check .claude/scripts plugins || true

      - name: Format check
        run: |
          ruff format --check .claude/scripts plugins || true
          isort --check-only .claude/scripts plugins || true

      - name: Comment on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠ Linting issues detected. Run `ruff check .claude/scripts plugins --fix` locally.'
            })
