name: Test Matrix (Python 3.11—3.14)

on:
  push:
    branches: [main, develop]
    paths:
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.claude/scripts/**/*.py'
      - 'plugins/**/*.py'
      - '.github/workflows/test-matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.claude/scripts/**/*.py'
      - 'plugins/**/*.py'
      - '.github/workflows/test-matrix.yml'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .claude/scripts plugins || true
          ruff format --check .claude/scripts plugins || true

      - name: Type check with mypy
        run: |
          pip install mypy types-PyYAML types-requests
          mypy .claude/scripts/lib/ plugins/exec_orch/skills/ --ignore-missing-imports || true

      # R346: 종전 pytest 뒤 «|| echo» 가 실패·수집 0건·없는 경로(rc 4)를 전부 success 로 덮었다
      #   ('Run pytest' 1초 실측) · ubuntu 는 사용자 실행 환경(Windows)이 아니라 참고용 — 결과는 그대로 보이되 이 job 실패로 막지 않음
      - name: Run pytest (참고 · ubuntu · 단일 실행 + coverage)
        continue-on-error: true
        run: bash .claude/scripts/ci-pytest-gate.sh .claude/scripts/tests -q -rfEs --tb=short -p no:cacheprovider --cov=.claude/scripts --cov-report=xml

      # R354 16차: 위 참고 단계는 실패해도 success 라 «Linux 잡 success» 가 시험 통과 증거가 아니었다 · 줄바꿈 든 파일명은
      #   Windows(NTFS) 에서 만들 수 없어 post-impl-verify NUL 처리 시험이 Windows 에선 건너뛴다 → Linux 에서 이 시험만 필수로 돌리고
      #   시험별 결과(PASSED·SKIPPED·FAILED)를 공개 주석으로 남긴다 (잡 로그 원문은 인증이 필요해 외부 검토가 못 봄)
      - name: post-impl-verify 파일명 경계 시험 (필수 · Linux 전용 증거)
        run: |
          set +e
          out=$(python -m pytest .claude/scripts/tests/test_r354_post_impl_scope.py -q -rA -p no:cacheprovider 2>&1)
          rc=$?
          echo "$out" | tail -25
          res=$(printf '%s\n' "$out" | grep -E '^(PASSED|FAILED|SKIPPED|ERROR) ' | sed 's/ - .*//' | tr '\n' ';' | head -c 900)
          echo "::notice title=R354 post-impl-verify 파일명 경계 (py ${{ matrix.python-version }})::rc=$rc · $res"
          exit $rc

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Validate plugin schemas (필수)
        run: python .claude/scripts/validate-plugin-schema.py --strict

      - name: Dry-run install check
        run: bash .claude/scripts/smoke-test.sh || echo "⚠ Smoke test partial"

  test-windows:
    # R346 필수 검사: 사용자 실제 환경(Windows 11 · Python 3.14) 과 같은 조건 — 시험 실패·수집 0건·사용 오류는 그대로 실패
    name: Test (필수) Windows · Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock psutil wcwidth python-pptx

      - name: Run pytest (필수)
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash .claude/scripts/ci-pytest-gate.sh .claude/scripts/tests -q -rfEs --tb=short -p no:cacheprovider

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black isort pylint

      - name: Check with ruff
        run: ruff check .claude/scripts plugins || true

      - name: Format check
        run: |
          ruff format --check .claude/scripts plugins || true
          isort --check-only .claude/scripts plugins || true

      - name: Comment on PR
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠ Linting issues detected. Run `ruff check .claude/scripts plugins --fix` locally.'
            })
