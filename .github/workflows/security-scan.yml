name: Security Scan

on:
  push:
    branches: [main, develop]
    paths:
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.claude/scripts/**/*.py'
      - 'plugins/**/*.py'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] semgrep

      - name: Run bandit (Python security)
        continue-on-error: true
        run: |
          bandit -r .claude/scripts plugins -f json -o bandit-report.json || true
          bandit -r .claude/scripts plugins -f txt

      - name: Run semgrep (SAST)
        continue-on-error: true
        run: |
          semgrep --config=p/security-audit --config=p/python \
            .claude/scripts plugins --json --output=semgrep-report.json || true
          semgrep --config=p/security-audit --config=p/python \
            .claude/scripts plugins

      - name: Check for hardcoded secrets
        run: |
          python .claude/scripts/audit-hardcoded.py || true
          python .claude/scripts/audit-mojibake.py || true

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
          retention-days: 30

  dependabot:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Check for outdated packages
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --desc

      - name: Verify requirements.txt integrity
        run: |
          pip install --dry-run -r requirements.txt && echo "✓ Requirements OK"

  pr-comment:
    name: PR Security Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [security, dependabot]
    steps:
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!reviews.some(r => r.user.login === 'github-actions[bot]')) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✓ Security scans complete (bandit, semgrep, hardcoded-secrets). See workflow artifacts for details.'
              });
            }
