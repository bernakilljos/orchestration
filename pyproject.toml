[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestration-kit-v1"
version = "1.0.0"
description = "Multi-AI Orchestration Kit — Claude + Codex + Gemini integration"
authors = [{ name = "Claude", email = "noreply@anthropic.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "orchestration", "claude", "agents", "multi-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "anthropic>=1.17.0",
    "psutil>=5.9.0",
    "python-docx>=1.2.0",
    "python-pptx>=0.6.23",
    "Pillow>=10.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]

[tool.setuptools]
packages = ["plugins", ".claude"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build/", "dist/", ".venv", "node_modules", "setup/Output"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "W503",   # line break before binary operator
]

[tool.ruff.lint.isort]
profile = "black"
multi-line-mode = 3
include-trailing-comma = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv", "setup/Output"]

[tool.pytest.ini_options]
testpaths = [".claude/scripts/tests", "plugins/*/tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --cov=.claude/scripts --cov=plugins --cov-report=term-missing --cov-report=html"
minversion = "7.0"
filterwarnings = [
    "ignore::DeprecationWarning",
]
testmon_off = true

[tool.coverage.run]
branch = true
source = [".claude/scripts", "plugins"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "if sys.platform",
]
precision = 2
skip_covered = false
skip_empty = true
min_branch_coverage = 80
fail_under = 80

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["*/migrations/*", ".venv/*", "setup/Output/*"]

[project.urls]
Homepage = "https://github.com/anthropics/orchestration-kit-v1"
Documentation = "https://github.com/anthropics/orchestration-kit-v1/docs"
Repository = "https://github.com/anthropics/orchestration-kit-v1.git"
Issues = "https://github.com/anthropics/orchestration-kit-v1/issues"
